# Publishes the Bird JS/TS packages under packages/* to npm when a release tag
# is pushed to this mirror. One workflow publishes every package in the
# workspace; each package that is not yet on npm at its current version is
# published, so releasing one package leaves the others untouched (idempotent).
#
# Source of truth: clients/typescript/.mirror/ in the Bird monorepo — do NOT
# edit on the mirror; changes are synced from the monorepo by
# scripts/dev/sdk-release.sh.
#
# Auth is npm trusted publishing (OIDC) — there is no NPM_TOKEN. Each published
# package needs its own trusted publisher on npmjs.com pointing at this
# repository and this workflow file (release.yaml); they may all point at the
# same repo+workflow. Provenance is attached per package (it is scoped to the
# repo+workflow, so publishing from a packages/<name> subdir is fine).
#
# workflow_dispatch runs a dry-run (build + pack validation, no publish) so the
# pipeline can be exercised without cutting a release.
name: Release

on:
  push:
    # This mirror carries several independently-versioned packages, so its
    # release tags are namespaced per package — <surface>/v<version>, e.g.
    # sdk-node/v0.18.2 or realtime-node/v0.2.1. A bare v<version> cannot work
    # here: two packages reaching the same number would compete for one tag, and
    # tags are immutable. `v*` stays matched for the bare tags already on this
    # mirror from before the split.
    #
    # The tag only triggers the run. The publish step loops packages/* and ships
    # whatever is not yet on npm at the version in its own package.json, so the
    # tag name never decides what gets published.
    tags: ["v*", "*/v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack-validate only; do not publish"
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm trusted publishing + provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # npm trusted publishing (OIDC) needs npm >= 11.5.1. Pin npm 11: npm 12.0.0's
      # provenance is broken (its libnpmpublish requires the 'sigstore' module, which
      # that release does not bundle), so `npm publish --provenance` fails.
      - run: npm install -g npm@11

      # Publish every package that is not already on npm at its current version.
      # DRY_RUN validates the tarball without publishing. Idempotent: a package
      # whose exact version is already on npm is skipped, so a re-run after a
      # later-step failure never errors on a re-publish, and releasing one package
      # leaves the already-published siblings alone.
      #
      # Fault-isolated on purpose. A `run:` block is `bash -e`, so aborting on the
      # first failure let one package's missing npm trusted publisher withhold
      # every alphabetically-later sibling for five versions.
      - name: Publish packages
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          failed=""
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            name="$(node -p "require('./$dir/package.json').name")"
            ver="$(node -p "require('./$dir/package.json').version")"
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry-run: $name@$ver"
              if ( cd "$dir" && npm publish --provenance --access public --dry-run ); then
                echo "- dry-run ok \`$name@$ver\`" >> "$GITHUB_STEP_SUMMARY"
              else
                failed="$failed $name@$ver"
                echo "- **dry-run FAILED** \`$name@$ver\`" >> "$GITHUB_STEP_SUMMARY"
              fi
            elif npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "npm already has $name@$ver — skipping (idempotent)"
              echo "- already on npm \`$name@$ver\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "publishing $name@$ver"
              if ( cd "$dir" && npm publish --provenance --access public ); then
                echo "- published \`$name@$ver\`" >> "$GITHUB_STEP_SUMMARY"
              else
                failed="$failed $name@$ver"
                echo "- **PUBLISH FAILED** \`$name@$ver\`" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::npm publish failed for:$failed"
            exit 1
          fi

      # --notes-from-tag reuses the annotated tag's message (the released
      # package's CHANGELOG section, set by scripts/dev/sdk-release.sh).
      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --notes-from-tag --verify-tag

  # Smoke is its own job so the Publish job's colour is a true publish signal.
  # Sharing one job made every release red on npm propagation lag, which taught
  # everyone to ignore a red Release run.
  smoke:
    name: Smoke test (install from npm)
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Each package retries npm for up to ~5 minutes, so the budget scales with
    # packages/* — keep headroom or a timeout kill preempts the diagnostics.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
      # Smoke-test each package that ships one (install from npm, import over the
      # real entrypoint). Its version comes from that package's package.json.
      - run: |
          failed=""
          for dir in packages/*/; do
            [ -f "$dir/scripts/smoke.sh" ] || continue
            ver="$(node -p "require('./$dir/package.json').version")"
            ( cd "$dir" && ./scripts/smoke.sh "$ver" ) || failed="$failed $dir@$ver"
          done
          if [ -n "$failed" ]; then
            echo "::error::smoke failed for:$failed"
            exit 1
          fi
